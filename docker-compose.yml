services:
  db:
    image: postgres:16-alpine
    container_name: school_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: school_admission
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend_1
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgrespassword
      - HOLD_DURATION_SECONDS=600
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"

  # BONUS 2.6: 2nd Backend process on separate port 8081 sharing same database
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school_backend_2
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=school_admission;Username=postgres;Password=postgrespassword
      - HOLD_DURATION_SECONDS=600
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: school_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: